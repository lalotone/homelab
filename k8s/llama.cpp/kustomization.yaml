#   kubectl apply -k .
# Swapping brains: flip the two `replicas` (gemma4-26b-a4b/README.md, "Swap and roll back").
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - shared
  - gemma4-26b-a4b
  - qwen38-27b
