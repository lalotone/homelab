# Mode A (llama.cpp brain). Deployed through the parent, ../kustomization.yaml (Argo CD app llama-cpp).
#   Running since 2026-11-25; ../gemma4-26b-a4b is at 0.
#   Qwen3.8-27B GGUF across both GPUs -> http://<heavy1>:30801/v1  (inside: llama-qwen38.llm:8000)
#
# The 27B can only be served by one engine at a time (both need both cards). Swap, don't stack: change `replicas` in
# Git, one engine at a time (README.md).
#
# No Namespace on purpose: 'llm' is created by k8s/vllm/qwen38-27b-single/deploy. That way a
# 'kubectl delete -k' here doesn't take the whole namespace with it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: llm

# The Service (pinned ClusterIP) is in ../shared, applied by the parent ../kustomization.yaml.
resources:
  - deployment.yaml

# server-cuda, NOT server: the plain :server tag is the CPU-only build (it logs "no usable GPU found" and
# silently ignores --n-gpu-layers/--tensor-split). Pinned to the build heavy1 already has, so a start doesn't pull a new
# one (tags: https://github.com/ggml-org/llama.cpp/pkgs/container/llama.cpp)
images:
  - name: ghcr.io/ggml-org/llama.cpp
    newTag: server-cuda-b12063
