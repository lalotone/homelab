# Qwen3.8-27B Unleashed (uncensored GGUF, UD-Q6_K) on heavy1 with llama.cpp, split across the 2× RTX 5060 Ti.
# From outsourc-e/Qwen3.8-27B-Unleashed-GGUF since 2026-11-25; before, unsloth/Qwen3.8-27B-GGUF UD-Q4_K_XL.
#
# Running since 2026-11-25; Gemma 4 (../gemma4-26b-a4b) is at 0. Only one brain at a time (both need both cards).
#
# This is the Mode A alternative to k8s/vllm/qwen38-27b-single. Both engines need both
# physical cards, so only one can run at a time: swap them by changing `replicas` in Git (README.md).
#
# Why llama.cpp and not vLLM here: vLLM grabs ~0.91 × 16 GB of each card (leaving ~1 GB),
# which is why the voice assistant (k8s/esp32-homeai) had to run its TTS on the CPU.
# llama.cpp only allocates weights + the KV cache you ask for, so it leaves ~6-7 GB/card
# free — enough for the voice's Qwen3-TTS to move onto a GPU share (see k8s/esp32-homeai/with-gpu).
#
# With this Q6_K that no longer holds: an estimated ~11.7 GB per card leaves ~4.6, and the voice pod needs ~5. To run
# the voice on the GPU next to it, use a Q4 (README.md, "Memory budget").
#
# Served as --alias qwen3.8-27b, so clients that used vLLM's model name keep working
# unchanged; only the base URL (service/ClusterIP) moves.
#
# Path on heavy1:
#   /mnt/models/Qwen3.8-27B-Unleashed-UD-Q6_K.gguf   the model (22.1 GB), mounted read-only at /models
#   /mnt/models/mmproj-Unleashed-f16.gguf            its vision encoder (0.93 GB), from the same repo
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-qwen38
  labels:
    app: llama-qwen38
spec:
  replicas: 1                           # running since 2026-11-25 (Rocky's voice still paused)
  strategy:
    type: Recreate                      # exclusive GPUs: never two pods at once
  selector:
    matchLabels:
      app: llama-qwen38
  template:
    metadata:
      labels:
        app: llama-qwen38
        llm-brain: llama-cpp            # what the shared Service (../shared) selects
    spec:
      runtimeClassName: nvidia          # created by the GPU Operator
      nodeSelector:
        kubernetes.io/hostname: heavy1  # the GGUF lives on its disk
      tolerations:
        - key: nvidia.com/gpu           # taint reserving heavy1's GPUs
          operator: Exists
          effect: NoSchedule
      terminationGracePeriodSeconds: 60
      containers:
        - name: llama
          image: ghcr.io/ggml-org/llama.cpp   # tag set in kustomization.yaml (ENTRYPOINT is llama-server)
          args:
            - -m
            - /models/Qwen3.8-27B-Unleashed-UD-Q6_K.gguf
            - --n-gpu-layers
            - "9999"                    # all layers on the GPUs
            - --tensor-split
            # More layers on CUDA0, because CUDA1 also carries the vision encoder and its buffers (below): with 1,1 it
            # used 10.7 GB vs 8.3, and the voice pod (~5 GB, time-sliced onto either card) ran out of memory on it.
            # 1.3,1 left both cards ~9.5 GB used with the old Q4_K_XL (Q6_K: ~11.7 estimated, voice pod doesn't fit).
            - "1.3,1"
            # Vision: Qwen3.8-27B is multimodal; the GGUF ships the vision encoder separately (mmproj, ~0.93 GB).
            # It and the "main" GPU work go on CUDA1 (06:00.0, see CUDA_DEVICE_ORDER below), away from the voice
            # pod's usual card, since time-slicing shares compute, not memory.
            - --main-gpu
            - "1"
            - --mmproj
            - /models/mmproj-Unleashed-f16.gguf   # built from the same weights as the model: keep the two together
            - --mmproj-device
            - CUDA1
            - --image-max-tokens
            - "2048"                    # ~1660x1250 px of detail per image (bench work: markings, parts); ~2k tokens of context
            - --ctx-size
            - "131072"                  # 128K for OpenCode, shared by the slots: ~4.25 GiB of KV cache (16 full-attention layers, q8_0)
            - --parallel
            - "1"                       # one slot gets all 128K; the default (4 slots sharing it) let OpenCode's parallel requests overflow it
            - --cache-type-k
            - q8_0                      # quantized KV cache: ~half the memory of f16
            - --cache-type-v
            - q8_0
            - --jinja                   # use the model's own chat template from the GGUF
            - --chat-template-kwargs    # the template's default effort is xhigh, which overthinks; a request can still override it
            - '{"reasoning_effort":"medium"}'
            # Speculative decoding with the MTP head built into the GGUF: it guesses the next 3 tokens, the model checks them
            # in one pass. Draft on the GPU (Gemma's MTP was very slow with the default placement), on CUDA1 (more free).
            - --spec-type
            - draft-mtp
            - --spec-draft-n-max
            - "3"
            - --spec-draft-ngl
            - all
            - --spec-draft-device
            - CUDA1
            - --alias
            - qwen3.8-27b               # served model name (matches vLLM's, so clients are unchanged)
            - --host
            - 0.0.0.0
            - --port
            - "8000"
          env:
            - name: CUDA_DEVICE_ORDER     # CUDA0/CUDA1 = 01:00.0/06:00.0, as nvidia-smi numbers them
              value: PCI_BUS_ID
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: "2"
              memory: 8Gi
              nvidia.com/gpu: 2
            limits:
              memory: 32Gi              # llama.cpp keeps prompt snapshots (checkpoints, prompt cache) in RAM
              nvidia.com/gpu: 2
          startupProbe:                         # 1st start: read the 16 GB GGUF from disk + load to the GPUs
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 120               # 20 min
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          volumeMounts:
            - name: shm                         # the default 64 MB /dev/shm isn't enough for CUDA workloads
              mountPath: /dev/shm
            - name: model
              mountPath: /models
              readOnly: true
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 4Gi
        - name: model
          hostPath:
            path: /mnt/models
            type: Directory                     # must exist: fail fast instead of starting with no model
