# Pi-hole: network-wide ad blocking DNS for the house, on endurance-1. README.md has the setup.
#   kubectl apply -k .
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pihole

resources:
  - namespace.yaml
  - deployment.yaml

# Date tags; pinned to a release at least two weeks old (2026.10.1 was too fresh on 2026-11-09).
images:
  - name: pihole/pihole
    newTag: 2026.10.0
