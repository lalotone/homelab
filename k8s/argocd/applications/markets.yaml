apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: markets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/lalotone/homelab
    targetRevision: main
    path: k8s/markets
  destination:
    server: https://kubernetes.default.svc
    namespace: markets
  syncPolicy:
    automated:
      prune: true
      selfHeal: false   # same as the other Applications (../README.md)
