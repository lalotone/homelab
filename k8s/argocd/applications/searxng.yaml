apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: searxng
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/lalotone/homelab
    targetRevision: main
    path: k8s/searxng
  destination:
    server: https://kubernetes.default.svc
    namespace: searxng
  syncPolicy:
    automated:
      prune: true
      selfHeal: false   # the READMEs' quick kubectl shortcuts rely on this (../README.md)
