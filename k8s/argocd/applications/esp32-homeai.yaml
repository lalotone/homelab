# The voice assistant API, on the GPU overlay (with-gpu, not deploy: that one is the CPU rollback).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: esp32-homeai
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/lalotone/homelab
    targetRevision: main
    path: k8s/esp32-homeai/with-gpu
  destination:
    server: https://kubernetes.default.svc
    namespace: voice
  syncPolicy:
    automated:
      prune: true
      selfHeal: false   # the READMEs' quick kubectl shortcuts rely on this (../README.md)
