apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# vLLM models served by KServe, applied by hand for now (not an Argo CD Application). See ../README.md.
resources:
  - namespace.yaml
  - servingruntime.yaml
  - qwen38-27b.yaml
  - nodeport.yaml

# Copy of ../../vllm/qwen38-27b-single/deploy/chat_template.jinja (thinking medium, preserve_thinking chain).
configMapGenerator:
  - name: qwen38-chat-template
    namespace: models
    files:
      - chat_template.jinja

# Kustomize can't rewrite the ConfigMap's name inside an InferenceService, so no hash suffix. After changing the
# template: kubectl apply -k . && kubectl -n models rollout restart deploy/qwen38-27b-predictor
generatorOptions:
  disableNameSuffixHash: true
