# Qwen3.8-27B NVFP4 on vLLM, served by KServe: the same model and flags as k8s/vllm/qwen38-27b-single/deploy (the plain
# Deployment, kept at replicas 0), now as an InferenceService on our own ServingRuntime (servingruntime.yaml).
# Needs both GPUs: Rocky (voice + llama.cpp brain) must be at 0 first.
#
# How the runtime and this file combine: fields set here win, and the args below are appended to the runtime's
# --port=8080 (KServe v0.21.0 doesn't de-duplicate flags, hence our own runtime without --model).
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: qwen38-27b
  namespace: models
spec:
  predictor:
    minReplicas: 1
    maxReplicas: 1
    deploymentStrategy:
      type: Recreate                    # exclusive GPUs: never two pods at once
    runtimeClassName: nvidia            # created by the GPU Operator
    nodeSelector:
      kubernetes.io/hostname: heavy1    # the model and caches live on its disk
    tolerations:
      - key: nvidia.com/gpu             # taint reserving heavy1's GPUs
        operator: Exists
        effect: NoSchedule
    terminationGracePeriodSeconds: 60
    model:
      modelFormat:
        name: vLLM
      runtime: vllm-hf-cache            # servingruntime.yaml (image vllm/vllm-openai:v0.30.0)
      # No storageUri: the model is already in heavy1's Hugging Face cache (hostPath below), so vLLM loads it by
      # name, offline, like the plain Deployment. (A pvc:// storageUri pointing into an HF cache breaks: its files are
      # relative symlinks into ../../blobs.)
      args:
        - --model=unsloth/Qwen3.8-27B-NVFP4
        - --served-model-name=qwen3.8-27b      # same name as before, so clients don't change
        - --tensor-parallel-size=2
        - --gpu-memory-utilization=0.91        # 0.92 is the highest that has started on heavy1
        - --kv-cache-dtype=fp8
        - --max-model-len=98304
        - --max-num-seqs=4
        - --max-num-batched-tokens=2048        # the FlashInfer autotuner scales with this
        - --enable-prefix-caching
        - --chat-template=/templates/chat_template.jinja
        - --reasoning-parser=qwen3
        - --enable-auto-tool-choice
        - --tool-call-parser=qwen3_coder
        - --linear-backend=auto
        - --trust-remote-code
        - --language-model-only                # no vision tower: +0.43 GiB/card
        - --max-cudagraph-capture-size=16      # 4 seqs × 3 tokens MTP = 12
        - '--speculative-config={"method":"mtp","num_speculative_tokens":2}'
      env:
        - name: HF_HOME                 # heavy1's cache (hostPath below)
          value: /root/.cache/huggingface
        - name: HF_HUB_OFFLINE          # never download: the model is already there
          value: "1"
        - name: MAX_JOBS                # FlashInfer JIT: don't blow up the 5600G's RAM
          value: "2"
        - name: NCCL_DEBUG              # if NCCL fails, have it say why
          value: WARN
      resources:
        requests:
          cpu: "4"
          memory: 16Gi
          nvidia.com/gpu: "2"           # both cards, TP=2
        limits:
          cpu: "10"
          memory: 48Gi
          nvidia.com/gpu: "2"
      volumeMounts:                     # /dev/shm comes from the runtime
        - name: hf-cache
          mountPath: /root/.cache/huggingface
        - name: jit-cache
          mountPath: /root/.cache/vllm
          subPath: vllm
        - name: jit-cache
          mountPath: /root/.cache/flashinfer
          subPath: flashinfer
        - name: chat-template
          mountPath: /templates
          readOnly: true
    volumes:
      - name: hf-cache
        hostPath:
          path: /mnt/vllm/hf            # the model, ~22 GB
          type: Directory
      - name: jit-cache
        hostPath:
          path: /mnt/vllm/cache         # compiled kernels: shared with the plain Deployment, so no recompiling
          type: DirectoryOrCreate
      - name: chat-template
        configMap:
          name: qwen38-chat-template    # generated by kustomization.yaml from chat_template.jinja
