# Qwen3.8-27B NVFP4 on heavy1 (2× RTX 5060 Ti, TP=2).
# Same flags as serve-vllm-qwen38.sh v9 (the config that already works).
#
# Paths on heavy1:
#   /mnt/vllm/hf     Hugging Face cache (the model, ~22 GB) → not downloaded again
#   /mnt/vllm/cache  compiled kernels (FlashInfer, torch.compile) → not recompiled
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-qwen38
  namespace: llm
  labels:
    app: vllm-qwen38
spec:
  replicas: 1
  strategy:
    type: Recreate                      # exclusive GPUs: never two pods at once
  selector:
    matchLabels:
      app: vllm-qwen38
  template:
    metadata:
      labels:
        app: vllm-qwen38
    spec:
      runtimeClassName: nvidia          # created by the GPU Operator
      nodeSelector:
        kubernetes.io/hostname: heavy1  # model and caches live on its disk
      tolerations:
        - key: nvidia.com/gpu           # taint reserving heavy1's GPUs
          operator: Exists
          effect: NoSchedule
      terminationGracePeriodSeconds: 60
      containers:
        - name: vllm
          image: vllm/vllm-openai       # version pinned in kustomization.yaml
          command: ["vllm", "serve"]    # explicit: don't rely on the image ENTRYPOINT
          args:
            - unsloth/Qwen3.8-27B-NVFP4
            - --served-model-name=qwen3.8-27b
            - --host=0.0.0.0
            - --port=8000
            - --tensor-parallel-size=2
            - --gpu-memory-utilization=0.91       # 0.92 is the highest that has started on heavy1
            - --kv-cache-dtype=fp8
            - --max-model-len=98304
            - --max-num-seqs=4
            - --max-num-batched-tokens=2048       # the FlashInfer autotuner scales with this
            - --enable-prefix-caching
            - --chat-template=/templates/chat_template.jinja
            - --reasoning-parser=qwen3
            - --enable-auto-tool-choice
            - --tool-call-parser=qwen3_coder
            - --linear-backend=auto
            - --trust-remote-code
            - --language-model-only               # no vision tower: +0.43 GiB/card
            - --max-cudagraph-capture-size=16     # 4 seqs × 3 tokens MTP = 12
            - '--speculative-config={"method":"mtp","num_speculative_tokens":2}'
          env:
            - name: HF_HUB_OFFLINE              # the model is already in /mnt/vllm/hf
              value: "1"
            - name: MAX_JOBS                    # FlashInfer JIT: don't blow up the 5600G's RAM
              value: "2"
            - name: NCCL_DEBUG                  # if NCCL fails, have it say why
              value: WARN
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: "4"
              memory: 16Gi
              nvidia.com/gpu: 2
            limits:
              memory: 48Gi
              nvidia.com/gpu: 2
          startupProbe:                         # first start: image + JIT, can take a while
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 180               # 30 min
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          volumeMounts:
            - name: shm                         # TP=2 + NCCL: the default 64 MB isn't enough
              mountPath: /dev/shm
            - name: hf-cache
              mountPath: /root/.cache/huggingface
            - name: jit-cache
              mountPath: /root/.cache/vllm
              subPath: vllm
            - name: jit-cache
              mountPath: /root/.cache/flashinfer
              subPath: flashinfer
            - name: chat-template
              mountPath: /templates
              readOnly: true
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
        - name: hf-cache
          hostPath:
            path: /mnt/vllm/hf
            type: Directory
        - name: jit-cache
          hostPath:
            path: /mnt/vllm/cache
            type: DirectoryOrCreate
        - name: chat-template
          configMap:
            name: vllm-qwen38-chat-template     # generated by kustomize from chat_template.jinja
