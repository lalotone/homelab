# kubectl apply -k .
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml

# Same version as the host's vLLM: the flags were validated against it.
# Check it with:  /opt/vllm/bin/vllm --version   → newTag: v<that version>
images:
  - name: vllm/vllm-openai
    newTag: v0.30.0

# The patched template (thinking medium, preserve_thinking chain, "high"→medium)
# that serve-vllm-qwen38.sh generated and verified. Copy it into this folder:
#   cp ~/.cache/vllm-qwen38/chat_template.think.medium.chain.jinja chat_template.jinja
# If you change it, kustomize generates a new ConfigMap and the Deployment restarts on its own.
configMapGenerator:
  - name: vllm-qwen38-chat-template
    namespace: llm
    files:
      - chat_template.jinja
