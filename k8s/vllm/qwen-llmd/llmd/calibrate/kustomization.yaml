# Measures peakPrefillThroughput (tokens/s) of ONE replica: Qwen3-8B FP8 on one 5060 Ti.
# prefix-cache-affinity-filter uses this value to estimate each pod's TTFT.
# From the LAPTOP, with NO other traffic on the system:
#
#   kubectl -n llm delete job calibrate-peak-throughput --ignore-not-found
#   kubectl apply -k calibrate/
#   kubectl -n llm wait --for=condition=complete --timeout=600s job/calibrate-peak-throughput
#   kubectl -n llm logs job/calibrate-peak-throughput | grep PEAK_PREFILL_THROUGHPUT
#
# Put the number in config/epp-config.yaml (peakPrefillThroughput) and run 'kubectl apply -k .'
# (the ConfigMap hash changes → the EPP restarts on its own).
#
# Random token-ID prompts → 0% cache, real prefill. CHUNK_SIZE = --max-num-batched-tokens
# from ../model/deployment.yaml (4096): one full prefill chunk, as the llm-d recipe asks.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: llm

resources:
  - job.yaml

configMapGenerator:
  - name: calibrate-script
    files:
      - calibrate.py
