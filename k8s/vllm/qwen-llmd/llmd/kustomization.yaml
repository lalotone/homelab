# Mode B, step 2: llm-d router (standalone: Envoy + EPP in one pod) in front of the
# same qwen3-8b pods from ../model/. Everything from the LAPTOP:
#
#   kubectl apply -k crds/          # once: InferencePool CRD (cluster-wide)
#   kubectl apply -k .              # router
#
#   http://<heavy1>:30820/v1  → llm-d router (cache-aware)
#   http://<heavy1>:30810/v1  → plain Service (round-robin), kept for comparison
#
# Requirements: ../model applied and both replicas Ready (the 27B scaled to 0).
# No Namespace on purpose ('llm' belongs to the 27B kustomization): a
# 'kubectl delete -k .' here only removes the router, not the namespace or the vLLM pods.
#
# Based on llm-d-router v0.11.0 (llm-d-router-standalone chart + optimized-baseline guide).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: llm

resources:
  - inferencepool.yaml
  - rbac.yaml
  - epp.yaml
  - service.yaml

configMapGenerator:
  - name: qwen3-8b-epp-config
    files:
      - config/epp-config.yaml
  - name: qwen3-8b-envoy
    files:
      - config/envoy.yaml

images:
  - name: ghcr.io/llm-d/llm-d-router-endpoint-picker
    newTag: v0.11.0
