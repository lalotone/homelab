# InferencePool = "a Service for LLMs". Groups the pods serving the SAME model
# and names the EPP (Endpoint Picker) that decides where each request goes.
#
# Selects the pods from ../model/deployment.yaml by the label they already carry;
# those pods are left untouched. The round-robin Service (:30810) keeps working alongside.
apiVersion: inference.networking.k8s.io/v1
kind: InferencePool
metadata:
  name: qwen3-8b
spec:
  selector:
    matchLabels:
      llm.model: qwen3-8b
  targetPorts:
    - number: 8000            # vLLM port on each pod
  appProtocol: http
  endpointPickerRef:          # EPP Service (service.yaml)
    name: qwen3-8b-epp
    port:
      number: 9002            # ext_proc gRPC
    failureMode: FailClose    # without the EPP there's nowhere to send (Envoy uses ORIGINAL_DST)
