# 1) Service del EPP: lo referencia el InferencePool (endpointPickerRef) y expone
#    las métricas del router (llm_d_epp_*) en :9090.
apiVersion: v1
kind: Service
metadata:
  name: qwen3-8b-epp
  labels:
    app: qwen3-8b-epp
spec:
  type: ClusterIP
  selector:
    app: qwen3-8b-epp
  ports:
    - name: grpc-ext-proc
      port: 9002
      targetPort: grpc
      appProtocol: kubernetes.io/h2c
    - name: http-metrics
      port: 9090
      targetPort: metrics
    - name: envoy-metrics
      port: 19001
      targetPort: envoy-metrics
---
# 2) La entrada de los usuarios: API OpenAI a través de Envoy + EPP.
#    Desde el portátil:  http://<heavy1>:30820/v1   (compárala con :30810, round-robin)
#    Dentro (OpenWebUI): http://qwen3-8b-router.llm:8000/v1
apiVersion: v1
kind: Service
metadata:
  name: qwen3-8b-router
  labels:
    app: qwen3-8b-epp
spec:
  type: NodePort
  selector:
    app: qwen3-8b-epp
  ports:
    - name: http
      port: 8000
      targetPort: http       # Envoy :8081
      nodePort: 30820
