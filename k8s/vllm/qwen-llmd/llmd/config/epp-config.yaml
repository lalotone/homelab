# Router brain: which plugins the EPP uses to pick a replica.
# Composition = llm-d's official "optimized-baseline" guide (the one recommended for vLLM):
#
#   1. approx-prefix-cache-producer  the EPP remembers which prefixes (64-token blocks)
#                                    it sent to each pod → estimates its cache without asking vLLM
#   2. inflight-load-producer        counts tokens "in flight" per pod (not finished yet)
#   3. prefix-cache-affinity-filter  if a pod already holds ≥80% of the prompt in cache → ONLY that one
#                                    ("sticky")... unless it's so loaded that its estimated
#                                    TTFT exceeds another pod's by > maxTTFTPenaltyMs
#   4. token-load-scorer             among the remaining pods, the one with the fewest tokens in flight
#   (max-score picker, OpenAI parsers and vLLM metrics are added automatically by default)
#
# Result: conversations go back to "their" replica (warm cache → low TTFT) and
# new ones go to the least-loaded one. "Sticky until saturated".
apiVersion: llm-d.ai/v1alpha1
kind: EndpointPickerConfig
plugins:
  - type: approx-prefix-cache-producer
    parameters:
      autoTune: true                  # reads block_size (64) and cache size from vLLM /metrics
  - type: inflight-load-producer
  - type: prefix-cache-affinity-filter
    parameters:
      affinityThreshold: 0.80         # default
      maxTTFTPenaltyMs: 18000         # default
      explorationProbability: 0       # default
      # CALIBRATE: the default (15928 tok/s) is Qwen3-32B on 2×H100. A 5060 Ti with
      # Qwen3-8B FP8 will give a different number. Measure it with calibrate/ and put it here.
      peakPrefillThroughput: 15928
  - type: token-load-scorer
schedulingProfiles:
  - name: default
    plugins:
      - pluginRef: prefix-cache-affinity-filter
      - pluginRef: token-load-scorer
