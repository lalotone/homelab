# Step 0 (once, cluster-wide): InferencePool CRD (inference.networking.k8s.io/v1)
#   kubectl apply -k crds/
#
# Pinned to the version llm-d-router v0.11.0 uses (deploy/components/crds-gie).
# Kept apart on purpose: a 'kubectl delete -k .' of the router does NOT delete the CRD
# (deleting a CRD deletes all its objects across the whole cluster).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - https://github.com/kubernetes-sigs/gateway-api-inference-extension/releases/download/v1.5.0/v1-manifests.yaml
