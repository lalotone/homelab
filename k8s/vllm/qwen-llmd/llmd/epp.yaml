# llm-d router in standalone mode: ONE pod with two containers
#   envoy  → receives OpenAI traffic on :8081 and asks the EPP about each request
#   epp    → Endpoint Picker: watches the InferencePool pods, scrapes their /metrics,
#            applies config/epp-config.yaml and answers "send this to <pod-IP>:8000"
#
# Equivalent to 'helm template' of the llm-d-router-standalone v0.11.0 chart, trimmed to
# what we use and with resources sized for a 5600G (the chart asks for 8 CPU + 4 CPU by default).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen3-8b-epp
  labels:
    app: qwen3-8b-epp
    llm-d.ai/igw-mode: llm-d-router-standalone
spec:
  replicas: 1             # 1 active: the prefix index lives in the EPP's memory
  strategy:
    type: Recreate        # recommended by llm-d for a stateful EPP
  selector:
    matchLabels:
      app: qwen3-8b-epp
  template:
    metadata:
      labels:
        app: qwen3-8b-epp
        llm-d.ai/igw-mode: llm-d-router-standalone
    spec:
      serviceAccountName: qwen3-8b-epp
      # Everything runs on heavy1 (the Pi is the control plane and arm64). No GPU, but heavy1
      # carries the GPU taint, so the toleration is needed.
      nodeSelector:
        kubernetes.io/hostname: heavy1
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      terminationGracePeriodSeconds: 60
      containers:
        - name: envoy
          image: docker.io/envoyproxy/envoy:distroless-v1.33.2   # same as chart v0.11.0
          imagePullPolicy: IfNotPresent
          command: ["envoy"]
          args:
            - --service-node
            - envoy-sidecar
            - --log-level
            - warn
            - --concurrency      # without this Envoy starts one worker per CPU thread
            - "2"
            - --drain-strategy
            - immediate
            - --drain-time-s
            - "60"
            - -c
            - /etc/envoy/envoy.yaml
          ports:
            - name: http
              containerPort: 8081
            - name: envoy-metrics
              containerPort: 19001
          readinessProbe:
            httpGet:
              path: /ready
              port: 19001
            periodSeconds: 5
            failureThreshold: 1
            timeoutSeconds: 1
          resources:
            requests:
              cpu: 200m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: envoy-config
              mountPath: /etc/envoy
              readOnly: true

        - name: epp
          image: ghcr.io/llm-d/llm-d-router-endpoint-picker   # tag set in kustomization.yaml
          imagePullPolicy: IfNotPresent
          args:
            - --pool-name=qwen3-8b
            - --pool-namespace=$(NAMESPACE)
            - --pool-group=inference.networking.k8s.io
            - --config-file=/config/epp-config.yaml
            - --grpc-health-port=9003
            - --zap-encoder=json
            - --v=2                          # 3-4 to see the reasoning behind each decision
            - --tracing=false
            - --metrics-endpoint-auth=false  # /metrics without a token: easy curl and Prometheus (lab)
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: grpc
              containerPort: 9002
            - name: grpc-health
              containerPort: 9003
            - name: metrics
              containerPort: 9090
          livenessProbe:
            grpc:
              port: 9003
              service: inference-extension
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            grpc:
              port: 9003
              service: inference-extension
            periodSeconds: 2
          lifecycle:
            preStop:
              sleep:              # the chart uses 'sh -c sleep 5', but the image is distroless
                seconds: 5        # (no shell); the native sleep action works on K8s 1.35
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: epp-config
              mountPath: /config
              readOnly: true
      volumes:
        - name: envoy-config
          configMap:
            name: qwen3-8b-envoy        # configMapGenerator: hash changes → automatic rollout
        - name: epp-config
          configMap:
            name: qwen3-8b-epp-config   # same
