# "ChatGPT at home" — one model, two identical replicas, one per card.
#
# Lab step 1 (BASELINE): plain Service → kube-proxy spreads requests
# without knowing anything about caches. This is where TTFT and prefix-cache hit
# rate are measured with several users. Later llm-d goes IN FRONT of these same pods
# (the InferencePool selects them by the labels below) without touching them.
#
# Model: Qwen/Qwen3-8B-FP8 — standard attention (36 layers, 8 KV heads, dim 128).
# NOT Qwen3.5: it's hybrid and vLLM gives it KV blocks of 528+ tokens, which
# breaks prefix caching on short prompts and llm-d's scorers.
#
# Budget per card (estimated; vLLM prints it in the startup log):
#   budget 0.90 × 15.47 = 13.9 GiB · weights ~8.8 · graphs+activations ~1.2
#   KV fp8 = 36 × 8 × 128 × 2 × 1 B = 72 KiB/token → pool ~3.9 GiB ≈ 55K tokens
#   → 8 concurrent conversations of up to 32K, or many more regular chats (2-4K).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-qwen3-8b
  labels:
    app: vllm-qwen3-8b
    app.kubernetes.io/part-of: llm-pool
    llm.model: qwen3-8b
spec:
  replicas: 2                            # one per GPU
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0                        # there's no 3rd GPU: never an extra pod
      maxUnavailable: 1                  # update one at a time: the service stays up
  selector:
    matchLabels:
      app: vllm-qwen3-8b
  template:
    metadata:
      labels:
        app: vllm-qwen3-8b
        app.kubernetes.io/part-of: llm-pool
        llm.model: qwen3-8b              # what llm-d's InferencePool will select
    spec:
      runtimeClassName: nvidia
      nodeSelector:
        kubernetes.io/hostname: heavy1
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      terminationGracePeriodSeconds: 60
      containers:
        - name: vllm
          image: vllm/vllm-openai
          command: ["vllm", "serve"]
          args:
            - Qwen/Qwen3-8B-FP8
            - --served-model-name=qwen3-8b
            - --host=0.0.0.0
            - --port=8000
            - --tensor-parallel-size=1
            - --gpu-memory-utilization=0.90      # no NCCL: 1.55 GiB outside the budget is enough
            - --kv-cache-dtype=fp8
            - --max-model-len=32768              # Qwen3-8B native context
            - --max-num-seqs=8                   # concurrent users per replica
            - --max-num-batched-tokens=4096
            - --enable-prefix-caching
            - --block-size=64                    # the one from the llm-d guide (step 3: KV events)
            - --reasoning-parser=qwen3
            - --enable-auto-tool-choice
            - --tool-call-parser=hermes          # Qwen3 uses Hermes-style tool calls (JSON)
            - --max-cudagraph-capture-size=16
            # Official Qwen3 sampling for thinking mode (the default mode)
            - '--override-generation-config={"temperature":0.6,"top_p":0.95,"top_k":20,"min_p":0.0}'
          env:
            - name: MAX_JOBS                     # JIT: don't blow up the 5600G's RAM
              value: "2"
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: "2"
              memory: 12Gi
              nvidia.com/gpu: 1
            limits:
              memory: 28Gi
              nvidia.com/gpu: 1
          startupProbe:                          # 1st time: ~9 GB download + JIT
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 180
          readinessProbe:                        # until Ready, the Service sends it no traffic
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          volumeMounts:
            - name: shm
              mountPath: /dev/shm
            - name: hf-cache
              mountPath: /root/.cache/huggingface
            - name: jit-cache
              mountPath: /root/.cache/vllm
              subPath: qwen3-8b/vllm
            - name: jit-cache
              mountPath: /root/.cache/flashinfer
              subPath: qwen3-8b/flashinfer
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 4Gi
        - name: hf-cache
          hostPath:
            path: /mnt/vllm/hf
            type: Directory
        - name: jit-cache
          hostPath:
            path: /mnt/vllm/cache
            type: DirectoryOrCreate
---
# Baseline: plain Service. kube-proxy spreads requests without looking at caches or queues.
# ClusterIP for OpenWebUI (inside the cluster) + NodePort for testing from the laptop.
apiVersion: v1
kind: Service
metadata:
  name: vllm-qwen3-8b
  labels:
    app: vllm-qwen3-8b
    app.kubernetes.io/part-of: llm-pool
spec:
  type: NodePort
  selector:
    app: vllm-qwen3-8b
  ports:
    - name: http
      port: 8000
      targetPort: http
      nodePort: 30810
