# "ChatGPT en casa" — un modelo, dos réplicas idénticas, una por tarjeta.
#
# Paso 1 del laboratorio (BASELINE): Service normal → kube-proxy reparte las
# peticiones sin saber nada de cachés. Aquí se mide TTFT y prefix-cache hit
# rate con varios usuarios. Después llm-d se pone DELANTE de estos mismos pods
# (InferencePool selecciona por las etiquetas de abajo) sin tocarlos.
#
# Modelo: Qwen/Qwen3-8B-FP8 — atención estándar (36 capas, 8 KV heads, dim 128).
# NO Qwen3.5: es híbrido y vLLM le pone bloques de KV de 528+ tokens, lo que
# rompe el prefix caching en prompts cortos y los scorers de llm-d.
#
# Presupuesto por tarjeta (estimado; vLLM lo dice en el log al arrancar):
#   budget 0.90 × 15.47 = 13.9 GiB · pesos ~8.8 · grafos+activaciones ~1.2
#   KV fp8 = 36 × 8 × 128 × 2 × 1 B = 72 KiB/token → pool ~3.9 GiB ≈ 55K tokens
#   → 8 conversaciones a la vez de hasta 32K, o muchas más de chat normal (2-4K).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-qwen3-8b
  labels:
    app: vllm-qwen3-8b
    app.kubernetes.io/part-of: llm-pool
    llm.model: qwen3-8b
spec:
  replicas: 2                            # una por GPU
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0                        # no hay 3ª GPU: nunca un pod de más
      maxUnavailable: 1                  # actualiza de una en una: el servicio sigue vivo
  selector:
    matchLabels:
      app: vllm-qwen3-8b
  template:
    metadata:
      labels:
        app: vllm-qwen3-8b
        app.kubernetes.io/part-of: llm-pool
        llm.model: qwen3-8b              # lo que seleccionará el InferencePool de llm-d
    spec:
      runtimeClassName: nvidia
      nodeSelector:
        kubernetes.io/hostname: heavy1
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      terminationGracePeriodSeconds: 60
      containers:
        - name: vllm
          image: vllm/vllm-openai
          command: ["vllm", "serve"]
          args:
            - Qwen/Qwen3-8B-FP8
            - --served-model-name=qwen3-8b
            - --host=0.0.0.0
            - --port=8000
            - --tensor-parallel-size=1
            - --gpu-memory-utilization=0.90      # sin NCCL: 1.55 GiB fuera del budget bastan
            - --kv-cache-dtype=fp8
            - --max-model-len=32768              # contexto nativo de Qwen3-8B
            - --max-num-seqs=8                   # usuarios a la vez por réplica
            - --max-num-batched-tokens=4096
            - --enable-prefix-caching
            - --block-size=64                    # el de la guía de llm-d (paso 3: KV events)
            - --reasoning-parser=qwen3
            - --enable-auto-tool-choice
            - --tool-call-parser=hermes          # Qwen3 usa tool calls estilo Hermes (JSON)
            - --max-cudagraph-capture-size=16
            # Sampling oficial de Qwen3 en modo thinking (el modo por defecto)
            - '--override-generation-config={"temperature":0.6,"top_p":0.95,"top_k":20,"min_p":0.0}'
          env:
            - name: MAX_JOBS                     # JIT: no reventar la RAM del 5600G
              value: "2"
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: "2"
              memory: 12Gi
              nvidia.com/gpu: 1
            limits:
              memory: 28Gi
              nvidia.com/gpu: 1
          startupProbe:                          # 1ª vez: descarga ~9 GB + JIT
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 180
          readinessProbe:                        # sin Ready, el Service no le manda tráfico
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          volumeMounts:
            - name: shm
              mountPath: /dev/shm
            - name: hf-cache
              mountPath: /root/.cache/huggingface
            - name: jit-cache
              mountPath: /root/.cache/vllm
              subPath: qwen3-8b/vllm
            - name: jit-cache
              mountPath: /root/.cache/flashinfer
              subPath: qwen3-8b/flashinfer
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 4Gi
        - name: hf-cache
          hostPath:
            path: /mnt/vllm/hf
            type: Directory
        - name: jit-cache
          hostPath:
            path: /mnt/vllm/cache
            type: DirectoryOrCreate
---
# Baseline: Service normal. kube-proxy reparte sin mirar cachés ni colas.
# ClusterIP para OpenWebUI (dentro del cluster) + NodePort para probar desde el portátil.
apiVersion: v1
kind: Service
metadata:
  name: vllm-qwen3-8b
  labels:
    app: vllm-qwen3-8b
    app.kubernetes.io/part-of: llm-pool
spec:
  type: NodePort
  selector:
    app: vllm-qwen3-8b
  ports:
    - name: http
      port: 8000
      targetPort: http
      nodePort: 30810
