# Mode B — "ChatGPT at home":   kubectl apply -k .
#   qwen3-8b ×2 replicas → http://<heavy1>:30810/v1  (inside: vllm-qwen3-8b.llm:8000)
#
# FIRST: the 27B (Mode A) uses both cards. Scale it down, don't delete it:
#   kubectl -n llm scale deploy/vllm-qwen38 --replicas=0
# Back to Mode A:
#   kubectl -n llm scale deploy/vllm-qwen3-8b --replicas=0
#   kubectl -n llm scale deploy/vllm-qwen38 --replicas=1
#
# No Namespace on purpose: 'llm' is created by the 27B kustomization. That way a
# 'kubectl delete -k' here doesn't take the whole namespace with it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: llm

resources:
  - deployment.yaml

# Same vLLM version as the 27B
images:
  - name: vllm/vllm-openai
    newTag: v0.30.0
